version: 2
updates:
  # Dépendances JavaScript du workspace (Bun / npm)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
    # Majors bloqués : ces montées cassent le toolchain et exigent une
    # adaptation manuelle du code (à faire dans une PR dédiée, pas en auto).
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@lucide/svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bits-ui"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]

  # Actions GitHub épinglées en SHA (maintient les pins à jour)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # Images de base des Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/apps/mythica-api"
      - "/apps/mythica-gameplay"
      - "/apps/mythica-gateway"
      - "/apps/mythica-front"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
