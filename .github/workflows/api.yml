name: mythica-api CI

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/mythica-api/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mythica-api/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"

defaults:
  run:
    working-directory: apps/mythica-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: bun run lint:ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mythica-api/Dockerfile
          push: false
          tags: mythica-api:ci

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Créer et appliquer la migration depuis le diff schéma↔DB
        run: bunx dotenvx run -f ./config/staging.env -- bunx prisma migrate dev --name auto
        env:
          DOTENV_PRIVATE_KEY_STAGINGDEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_API_STAGING }}

      - name: Committer les fichiers de migration générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git diff --staged --quiet || (git commit -m "chore(db): ajouter migration prisma auto-générée" && git push)

      - name: Debug secrets
        run: |
          echo "DOCKPLOY_URL défini: ${{ secrets.DOCKPLOY_URL != '' }}"
          echo "DOCKPLOY_TOKEN défini: ${{ secrets.DOCKPLOY_TOKEN != '' }}"
          echo "APP_ID défini: ${{ secrets.DOCKPLOY_APP_ID_API_STAGING != '' }}"

      - name: Déployer sur DOCKPLOY (staging)
        run: |
          curl -s -X POST "${{ secrets.DOCKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOCKPLOY_APP_ID_API_STAGING }}\"}"
        working-directory: .

  deploy-main:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Appliquer les migrations en attente
        run: bunx dotenvx run -f ./config/production.env -- bunx prisma migrate deploy
        env:
          DOTENV_PRIVATE_KEY_PRODUCTIONDEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_API_PRODUCTION }}

      - name: Déployer sur DOCKPLOY (production)
        run: |
          curl -s -X POST "${{ secrets.DOCKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOCKPLOY_APP_ID_API_PRODUCTION }}\"}"
        working-directory: .
