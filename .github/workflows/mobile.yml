name: mythica-mobile CI

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/mythica-mobile/**"
      - ".github/workflows/mobile.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mythica-mobile/**"
      - ".github/workflows/mobile.yml"
      - "package.json"
      - "bun.lock"

defaults:
  run:
    working-directory: apps/mythica-mobile

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Type check
        run: bunx tsc --noEmit

      - name: Scan Trivy du système de fichiers
        uses: ./.github/actions/trivy
        with:
          scan-type: fs
          scan-ref: apps/mythica-mobile
          title: mythica-mobile
