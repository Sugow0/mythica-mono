name: mythica-mobile CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'apps/mythica-mobile/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    branches: [main, staging]
    paths:
      - 'apps/mythica-mobile/**'
      - 'package.json'
      - 'bun.lock'

defaults:
  run:
    working-directory: apps/mythica-mobile

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Type check
        run: bunx tsc --noEmit
