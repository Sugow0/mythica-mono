name: mythica-mobile CI

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/mythica-mobile/**"
      - ".github/workflows/mobile.yml"
      - ".github/actions/**"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mythica-mobile/**"
      - ".github/workflows/mobile.yml"
      - ".github/actions/**"
      - "package.json"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mythica-mobile

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Scan Trivy du système de fichiers
        uses: ./.github/actions/trivy
        with:
          scan-type: fs
          scan-ref: apps/mythica-mobile
          title: mythica-mobile

      - name: Archiver le rapport Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-mobile
          path: trivy-report.txt
          if-no-files-found: ignore
