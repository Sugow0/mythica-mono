name: mythica-gateway CI

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/mythica-gateway/**"
      - ".github/workflows/gateway.yml"
      - ".github/actions/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mythica-gateway/**"
      - ".github/workflows/gateway.yml"
      - ".github/actions/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mythica-gateway

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: ./.github/actions/bun-install

      - name: Lint
        run: bun run lint:ci

  build:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/mythica-gateway/Dockerfile
          push: false
          load: true
          tags: mythica-gateway:ci

      - name: Scan Trivy de l'image
        uses: ./.github/actions/trivy
        with:
          scan-type: image
          scan-ref: mythica-gateway:ci
          title: mythica-gateway

      - name: Archiver le rapport Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-gateway
          path: trivy-report.txt
          if-no-files-found: ignore

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      APP_ID: ${{ github.ref_name == 'main' && secrets.DOCKPLOY_APP_ID_GATEWAY_PRODUCTION || secrets.DOCKPLOY_APP_ID_GATEWAY_STAGING }}
    steps:
      - name: Trigger DOCKPLOY deployment
        run: |
          curl -s -X POST "${{ secrets.DOCKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"$APP_ID\"}"
        working-directory: .
