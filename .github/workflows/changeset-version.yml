name: Changeset — Appliquer les versions

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  version:
    name: bunx changeset version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Appliquer les versions changeset
        run: bunx changeset version

      - name: Committer les versions bumped
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "chore(release): version packages" && git push)
