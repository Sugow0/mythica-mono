name: sonarcloud

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Analyse statique SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # Le scan ne tourne que si le secret SONAR_TOKEN est configuré.
      # SonarCloud gratuit nécessite un repo public ; sur repo privé, voir docs.
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarCloud non configuré
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::notice::SONAR_TOKEN absent — analyse SonarCloud ignorée."
          echo "Configurer le secret SONAR_TOKEN et un projet sur sonarcloud.io pour activer le quality gate."
