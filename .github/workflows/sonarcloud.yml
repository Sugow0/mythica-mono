name: sonarcloud

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarcloud:
    name: Analyse statique SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # Les rapports lcov doivent exister AVANT le scan pour que SonarCloud
      # mesure la couverture du new code (sinon : 0 %).
      - name: Installer les dépendances
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: ./.github/actions/bun-install

      - name: Installer Playwright (tests browser front)
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: apps/mythica-front
        run: bunx playwright install chromium --with-deps

      - name: Couverture — api
        if: ${{ env.SONAR_TOKEN != '' }}
        run: bun run --cwd apps/mythica-api test

      - name: Couverture — gameplay
        if: ${{ env.SONAR_TOKEN != '' }}
        run: bun run --cwd apps/mythica-gameplay test

      - name: Couverture — gateway
        if: ${{ env.SONAR_TOKEN != '' }}
        run: bun run --cwd apps/mythica-gateway test

      - name: Couverture — front
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: apps/mythica-front
        run: bunx vitest run --coverage

      # Le scan ne tourne que si le secret SONAR_TOKEN est configuré.
      # SonarCloud gratuit nécessite un repo public ; sur repo privé, voir docs.
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarCloud non configuré
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::notice::SONAR_TOKEN absent — analyse SonarCloud ignorée."
          echo "Configurer le secret SONAR_TOKEN et un projet sur sonarcloud.io pour activer le quality gate."
