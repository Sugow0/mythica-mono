name: mythica-gameplay CI

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/mythica-gameplay/**"
      - ".github/workflows/gameplay.yml"
      - ".github/actions/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mythica-gameplay/**"
      - ".github/workflows/gameplay.yml"
      - ".github/actions/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mythica-gameplay

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: ./.github/actions/bun-install

      - name: Lint
        run: bun run lint:ci

  build:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/mythica-gameplay/Dockerfile
          push: false
          load: true
          tags: mythica-gameplay:ci

      - name: Scan Trivy de l'image
        uses: ./.github/actions/trivy
        with:
          scan-type: image
          scan-ref: mythica-gameplay:ci
          title: mythica-gameplay

      - name: Archiver le rapport Trivy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-gameplay
          path: trivy-report.txt
          if-no-files-found: ignore

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/bun-install

      - name: Créer et appliquer la migration depuis le diff schéma↔DB
        run: bunx dotenvx run -f ./config/staging.env -- bunx prisma migrate dev --name auto
        env:
          DOTENV_PRIVATE_KEY_STAGINGDEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_GAMEPLAY_STAGING }}

      - name: Committer les fichiers de migration générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git diff --staged --quiet || (git commit -m "chore(db): ajouter migration prisma auto-générée" && git push)

      - name: Déployer sur DOCKPLOY (staging)
        run: |
          curl -s -X POST "${{ secrets.DOCKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOCKPLOY_APP_ID_API_STAGING }}\"}"
        working-directory: .

  deploy-main:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: ./.github/actions/bun-install

      - name: Appliquer les migrations en attente
        run: bunx dotenvx run -f ./config/production.env -- bunx prisma migrate deploy
        env:
          DOTENV_PRIVATE_KEY_PRODUCTIONDEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_GAMEPLAY_PRODUCTION }}

      - name: Déployer sur DOCKPLOY (production)
        run: |
          curl -s -X POST "${{ secrets.DOCKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOCKPLOY_APP_ID_GAMEPLAY_PRODUCTION }}\"}"
        working-directory: .
