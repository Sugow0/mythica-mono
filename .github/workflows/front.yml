name: mythica-front CI

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/mythica-front/**"
      - ".github/workflows/front.yml"
      - ".github/actions/**"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mythica-front/**"
      - ".github/workflows/front.yml"
      - ".github/actions/**"
      - "package.json"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mythica-front

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Format check
        run: bun run format:ci

      - name: Lint
        run: bun run lint:ci

      - name: Type check
        run: bun run check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run tests
        run: bun run test

      - name: Couverture de tests (best-effort)
        continue-on-error: true
        run: bunx vitest run --coverage --coverage.reporter=text 2>&1 | tee coverage.txt

      - name: Publier la couverture dans le résumé de CI
        if: always()
        run: |
          {
            echo "## 🧪 Couverture de tests — mythica-front"
            echo ""
            if [ -s coverage.txt ]; then
              echo '```'
              cat coverage.txt
              echo '```'
            else
              echo "Aucun rapport de couverture généré."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-front
          path: apps/mythica-front/coverage.txt
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/bun-install

      - name: Build
        run: bun run build

      - name: Scan Trivy du système de fichiers
        uses: ./.github/actions/trivy
        with:
          scan-type: fs
          scan-ref: apps/mythica-front
          title: mythica-front

      - name: Archiver le rapport Trivy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-front
          path: trivy-report.txt
          if-no-files-found: ignore

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      APP_ID: ${{ github.ref_name == 'main' && secrets.DOKPLOY_APP_ID_FRONT_PRODUCTION || secrets.DOKPLOY_APP_ID_FRONT_STAGING }}
    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -s -X POST "${{ secrets.DOCKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOCKPLOY_APP_ID_FRONT_STAGING }}\"}"
        working-directory: .
