name: mythica-front CI

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/mythica-front/**"
      - ".github/workflows/front.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mythica-front/**"
      - ".github/workflows/front.yml"
      - "package.json"
      - "bun.lock"

defaults:
  run:
    working-directory: apps/mythica-front

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Format check
        run: bun run format:ci

      - name: Lint
        run: bun run lint:ci

      - name: Type check
        run: bun run check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Build
        run: bun run build

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      APP_ID: ${{ github.ref_name == 'main' && secrets.DOKPLOY_APP_ID_FRONT_PRODUCTION || secrets.DOKPLOY_APP_ID_FRONT_STAGING }}
    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -s -X POST "${{ secrets.DOCKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"$APP_ID\"}"
        working-directory: .
