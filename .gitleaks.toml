# Configuration gitleaks — étend les règles par défaut et exclut les fichiers
# dont les « secrets » sont chiffrés par dotenvx (donc sûrs à committer).
[extend]
useDefault = true

[allowlist]
description = "Fichiers exclus du scan de secrets"
paths = [
  '''bun\.lock''',
  '''.*\.env$''',
  '''.*\.env\.[^/]+$''',
  '''.*/config/.*\.env$''',
]

# Faux positifs : clés TypeScript (collectionKey, propertyKey…) détectées
# comme "generic-api-key" à cause de leur entropie et du suffixe Key.
stopwords = [
  "collectionKey",
  "propertyKey",
  "displayKey",
  "sortKey",
  "skillKey",
  "abilityKey",
  "groupKey",
]
