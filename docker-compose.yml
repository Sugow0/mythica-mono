name: "mythica-dev"

services:
  postgres:
    image: postgres:latest
    container_name: postgres-mythica
    shm_size: 128mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123!
      POSTGRES_DB: mythica_db_dev
    ports:
      - "22000:5432"
    volumes:
      - postgres_mythica_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis-mythica
    ports:
      - "23000:6379" # Expose le port 6379 de Redis sur le port 23000 de l'hôte
    volumes:
      - redis_mythica_data:/data # Persiste les données Redis (optionnel)
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-mythica
    ports:
      - "24000:9000"
      - "24100:9001"
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password123!
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_mythica_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq-mythica
    ports:
      - "25000:5672"
      - "25100:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password123!
    volumes:
      - rabbitmq_mythica_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres_mythica_data:
  redis_mythica_data:
  rabbitmq_mythica_data:
  rustfs_mythica_data:
