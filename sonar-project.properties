sonar.projectKey=tengram-labs_mythica-mono
sonar.organization=tengram-labs

sonar.sources=apps
sonar.tests=apps
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.svelte.spec.ts

sonar.exclusions=**/node_modules/**,**/generated/**,**/build/**,**/.svelte-kit/**,**/paraglide/**,**/*.test.ts,**/*.spec.ts

# Couverture (importée depuis le rapport lcov généré par les pipelines de test).
sonar.javascript.lcov.reportPaths=apps/mythica-api/coverage/lcov.info,apps/mythica-front/coverage/lcov.info,apps/mythica-gameplay/coverage/lcov.info,apps/mythica-gateway/coverage/lcov.info

sonar.sourceEncoding=UTF-8
