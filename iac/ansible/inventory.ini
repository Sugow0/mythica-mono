# Cible de démonstration : un conteneur Docker local piloté via le plugin de
# connexion community.docker (pas besoin de SSH).
#
#   docker run -d --name mythica-target --add-host host.docker.internal:host-gateway ubuntu:22.04 sleep infinity
#   ansible-galaxy collection install community.docker
#   ansible-playbook playbook.yml
#
# Pour une VM (Vagrant) ou un serveur distant, remplacer par une connexion SSH.

[web]
mythica-target ansible_connection=community.docker.docker ansible_user=root
