name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Vérifier le lint et le formatage
        run: bun run lint:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Vérifier le build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  deploy:
    name: Déployer
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.event_name == 'push'
    env:
      APP_ID: ${{ github.ref_name == 'main' && secrets.DOKPLOY_APP_ID_GATEWAY_PRODUCTION || secrets.DOKPLOY_APP_ID_GATEWAY_STAGING }}
    steps:
      - name: Déclencher le déploiement Dockploy
        run: |
          curl -s -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"$APP_ID\"}"
