name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Vérifier le lint et le formatage
        run: bun run lint:ci

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Générer le client Prisma
        run: bunx prisma generate

      - name: Lancer les tests
        run: bun test

  migrate-staging:
    name: Créer et appliquer les migrations (staging)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Créer et appliquer la migration depuis le diff schéma↔DB
        run: bunx dotenvx run -f ./config/staging.env -- bunx prisma migrate dev --name auto
        env:
          DOTENV_PRIVATE_KEY_STAGINGDEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_STAGING }}

      - name: Committer les fichiers de migration générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git diff --staged --quiet || (git commit -m "chore(db): ajouter migration prisma auto-générée" && git push)

      - name: Deployer la branche staging sur Dokploy
        run: |
          curl -s -X POST "${{ secrets.DOCKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOCKPLOY_APP_ID_STAGING }}\"}"

  migrate-main:
    name: Appliquer les migrations (main)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Appliquer les migrations en attente
        run: bunx dotenvx run -f ./config/production.env -- bunx prisma migrate deploy
        env:
          DOTENV_PRIVATE_KEY_PRODUCTIONDEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
